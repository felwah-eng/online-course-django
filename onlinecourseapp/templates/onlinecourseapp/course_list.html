{% extends 'onlinecourseapp/base.html' %}
{% block title %}Available Courses{% endblock %}
{% block content %}
<h1 class="mb-4">Available Courses</h1>
<div class="row g-3">{% for course in courses %}
<div class="col-md-6"><div class="card h-100"><div class="card-body"><h2 class="h4">{{course.name}}</h2><p>{{course.description}}</p>
<a class="btn btn-primary" href="{% url 'onlinecourseapp:course_details' course.id %}">View Course</a></div></div></div>
{% empty %}<div class="alert alert-info">No courses yet. Run the demo seed command.</div>{% endfor %}</div>
{% endblock %}
