<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Online Course{% endblock %}</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<style>body{background:#f5f7fb}.page{max-width:980px;margin:3rem auto}.card{border:0;box-shadow:0 8px 26px rgba(20,40,70,.07)}.navbar{background:#17345b!important}</style>
</head><body>
<nav class="navbar navbar-dark"><div class="container"><a class="navbar-brand" href="{% url 'onlinecourseapp:course_list' %}">Online Course</a>
<span class="text-white">{% if user.is_authenticated %}{{ user.username }}{% else %}Guest{% endif %}</span></div></nav>
<div class="container page">{% for message in messages %}<div class="alert alert-warning">{{message}}</div>{% endfor %}{% block content %}{% endblock %}</div>
</body></html>
